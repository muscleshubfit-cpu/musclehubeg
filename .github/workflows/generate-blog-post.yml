name: Auto-generate blog post

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the blog-generation endpoint
        run: |
          HTTP_CODE=$(curl --silent --show-error --max-time 540 -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/generate-blog-post")
          echo "HTTP status: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/response.json
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Blog generation failed"
            exit 1
          fi
          echo "✓ Blog post generated successfully"
