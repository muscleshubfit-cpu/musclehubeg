name: Auto-generate blog post (3-step pipeline)

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Step 1 — Pick topic
        run: |
          echo "=== Step 1: Picking topic ==="
          HTTP_CODE=$(curl --silent --show-error --max-time 55 -o /tmp/step1.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/blog/step1-pick")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/step1.json
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Step 1 failed"
            exit 1
          fi
          echo "✓ Step 1 done"

      - name: Wait 5 seconds
        run: sleep 5

      - name: Step 2 — Generate article
        run: |
          echo "=== Step 2: Generating article ==="
          HTTP_CODE=$(curl --silent --show-error --max-time 55 -o /tmp/step2.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/blog/step2-generate")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/step2.json
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Step 2 failed"
            exit 1
          fi
          echo "✓ Step 2 done"

      - name: Wait 5 seconds
        run: sleep 5

      - name: Step 3 — Publish
        run: |
          echo "=== Step 3: Publishing ==="
          HTTP_CODE=$(curl --silent --show-error --max-time 55 -o /tmp/step3.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/blog/step3-publish")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/step3.json
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Step 3 failed"
            exit 1
          fi
          echo "✓ Step 3 done — article published!"
