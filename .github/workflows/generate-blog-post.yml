name: Auto-generate blog post (pipeline v2 — six AI phases)

# ============================================================
# 2026-08-27 (v2) — Owner-defined six-phase article pipeline:
#   P0 keyword/FAQ/topic research (per language, strongest free
#      models first with automatic fall-through)
#   P1 topic choice + SEO outline (+ LSI keywords + image plan)
#   P2 full content generation (1500–2500 words per language)
#   P3 images (3–5 per language, MODESTY-GUARDED prompts:
#      no nudity, no revealing imagery — hard owner rule)
#   P4 quality review (proofread, keyword check, fact-guard,
#      internal+external links, closing CTA)
#   P5 publish + auto-sitemap (pure code, NO AI models)
#
# Native execution: the job imports the SAME route handlers in-process
# (scripts/blog-runner/run-step.mts) — no Vercel hop, no 60s cap.
# AI_CHAIN_TOTAL_BUDGET_MS=180000 funds full-length completions.
# Keys come from GitHub Secrets; EVO chat stays on Vercel streaming.
# ============================================================

on:
  schedule:
    - cron: "0 6,14,22 * * *"
  workflow_dispatch: {}

concurrency:
  group: blog-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # ── Native-execution budget override (default on Vercel: 52000) ──
      AI_CHAIN_TOTAL_BUDGET_MS: "180000"

      # ── Required secrets (preflight fails fast naming missing ones) ──
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # ── Optional image-provider fallbacks (pollinations is keyless) ──
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight — required secrets present (fails fast, names the missing ones)
        run: |
          echo "=== Preflight: checking required GitHub Secrets ==="
          missing=0
          for v in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY CRON_SECRET GROQ_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "❌ Missing secret: $v"
              echo "   → add it under: Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret"
              missing=1
            fi
          done
          if [ -z "$OPENROUTER_API" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ Missing AI provider key — provide a secret named OPENROUTER_API (or OPENROUTER_API_KEY)"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "❌ Preflight failed — fix the secrets above and re-run."
            exit 1
          fi
          echo "✓ All required secrets present"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # NOTE: repo has NO package-lock.json → npm install (not npm ci)
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ══════════════════════════════════════════════════════════
      # SIX-PHASE PIPELINE (each step retries ×3 with backoff and
      # threads queueId automatically from P0's response)
      # ══════════════════════════════════════════════════════════

      - name: P0 — Keyword & topic research EN+AR (retry ×3)
        run: bash scripts/blog-runner/run-step.sh p0-research 3

      - name: P1 — Topic choice + outline EN+AR (retry ×3)
        run: bash scripts/blog-runner/run-step.sh p1-outline 3

      - name: P2 — Full content EN + AR, 1500–2500 words each (retry ×3)
        run: bash scripts/blog-runner/run-step.sh p2-content 3

      - name: P3 — Modesty-guarded images EN + AR, 3–5 each (retry ×3)
        run: bash scripts/blog-runner/run-step.sh p3-images 3

      - name: P4 — Quality review & links & CTA EN + AR (retry ×3)
        run: bash scripts/blog-runner/run-step.sh p4-review 3

      - name: P5 — Publish to blog_posts + auto-sitemap (retry ×3)
        run: bash scripts/blog-runner/run-step.sh p5-publish 3

      - name: Summary
        if: always()
        run: |
          echo "=== Pipeline v2 run summary ==="
          echo "QUEUE_ID processed: ${QUEUE_ID:-<none>}"
          echo "Full logs above — green ✓ = published (EN+AR), red ❌ = copy last lines and report."
