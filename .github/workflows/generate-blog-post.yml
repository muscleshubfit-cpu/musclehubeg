name: Auto-generate blog post

on:
  schedule:
    # Every 2 hours, UTC. Free — runs on GitHub's own infrastructure,
    # not Vercel, so it works with a Hobby (free) Vercel plan too
    # (Vercel's built-in cron only allows once/day on Hobby).
    - cron: "0 */2 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the blog-generation endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/generate-blog-post"
