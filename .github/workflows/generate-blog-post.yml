name: Auto-generate blog post (native GHA pipeline)

# ============================================================
# 2026-08-27 — NATIVE EXECUTION (Owner directive: run AI calls
# inside GitHub Actions, all keys from GitHub Secrets; EVO chat
# stays on Vercel streaming).
#
# The job imports the SAME Next.js route handlers in-process
# (scripts/blog-runner/run-step.mts) — no HTTP hop to Vercel, no
# 60-second Hobby cap. AI_CHAIN_TOTAL_BUDGET_MS=180000 lets each
# fallback chain run full-length completions instead of the 52s
# Vercel clamp. Vercel cron routes remain available for manual
# pings / the in-app editor, unchanged.
#
# Retry policy preserved: up to 3 attempts per step with linear
# backoff (2 min + 4 min), plus the Step1 → Step2a stabilization
# handoff buffer.
# ============================================================

on:
  schedule:
    - cron: "0 6,14,22 * * *"
  workflow_dispatch: {}

concurrency:
  group: blog-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # ── Native-execution budget override (default on Vercel: 52000) ──
      AI_CHAIN_TOTAL_BUDGET_MS: "180000"

      # ── Required secrets (fail-fast preflight below) ────────────────
      # Code accepts either OPENROUTER_API or OPENROUTER_API_KEY, so both
      # are mapped independently — whichever exists will be picked up.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # ── Optional image-provider fallbacks (pollinations is keyless) ──
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight — required secrets present (fails fast, names the missing ones)
        run: |
          echo "=== Preflight: checking required GitHub Secrets ==="
          missing=0
          for v in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY CRON_SECRET GROQ_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "❌ Missing secret: $v"
              echo "   → add it under: Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret"
              missing=1
            fi
          done
          if [ -z "$OPENROUTER_API" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ Missing AI provider key — provide a secret named OPENROUTER_API (or OPENROUTER_API_KEY)"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "❌ Preflight failed — fix the secrets above and re-run."
            exit 1
          fi
          echo "✓ All required secrets present"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # NOTE: repo has NO package-lock.json → npm install (not npm ci)
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ============================================================
      # Step 1 — Pick topics (EN + AR), controlled retry ×3
      # Success captures queueId into GITHUB_ENV for later steps.
      # ============================================================
      - name: Step 1 — Pick topics EN + AR (retry ×3)
        run: bash scripts/blog-runner/run-step.sh step1-pick 3

      # Stabilization handoff (orchestration-level sleep) — kept from
      # the previous design to let Supabase settle before research.
      - name: Wait 5 minutes — Step 1 → Step 2a stabilization handoff
        run: |
          echo "=== Handoff: waiting 5 minutes before Step 2a ==="
          sleep 300
          echo "✓ Handoff buffer elapsed"

      - name: Step 2a — Research (retry ×3)
        run: bash scripts/blog-runner/run-step.sh step2a-research 3

      - name: Step 2b — English article + SEO (retry ×3)
        run: bash scripts/blog-runner/run-step.sh step2b-en-article 3

      - name: Step 2c — Arabic article + FAQ (retry ×3)
        run: bash scripts/blog-runner/run-step.sh step2c-ar-article 3

      - name: Step 2d — Links + images + social (retry ×3)
        run: bash scripts/blog-runner/run-step.sh step2d-links 3

      - name: Step 3 — Publish (retry ×3)
        run: bash scripts/blog-runner/run-step.sh step3-publish 3

      - name: Summary
        if: always()
        run: |
          echo "=== Pipeline run summary ==="
          echo "QUEUE_ID processed: ${QUEUE_ID:-<none>}"
          echo "Full logs above — green ✓ = published, red ❌ = copy last lines and report."
