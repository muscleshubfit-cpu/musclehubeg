name: Auto-generate blog post (multi-step pipeline)

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Step 1 — Pick topic
        run: |
          echo "=== Step 1: Picking topic ==="
          HTTP_CODE=$(curl --silent --show-error --max-time 55 -o /tmp/step1.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/blog/step1-pick")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/step1.json
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Step 1 failed"
            exit 1
          fi
          echo "✓ Step 1 done"

      - name: Wait 5 seconds
        run: sleep 5

      - name: Step 2a — Research
        run: |
          echo "=== Step 2a: Researching topic ==="
          HTTP_CODE=$(curl --silent --show-error --max-time 55 -o /tmp/step2a.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/blog/step2a-research")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/step2a.json
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Step 2a failed"
            exit 1
          fi
          echo "✓ Step 2a done"

      - name: Wait 5 seconds
        run: sleep 5

      - name: Step 2b — English article + SEO
        run: |
          echo "=== Step 2b: Generating English article + SEO ==="
          HTTP_CODE=$(curl --silent --show-error --max-time 55 -o /tmp/step2b.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/blog/step2b-en-article")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/step2b.json
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Step 2b failed"
            exit 1
          fi
          echo "✓ Step 2b done"

      - name: Wait 5 seconds
        run: sleep 5

      - name: Step 2c — Arabic article + FAQ
        run: |
          echo "=== Step 2c: Generating Arabic article + FAQ ==="
          HTTP_CODE=$(curl --silent --show-error --max-time 55 -o /tmp/step2c.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/blog/step2c-ar-article")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/step2c.json
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Step 2c failed"
            exit 1
          fi
          echo "✓ Step 2c done"

      - name: Wait 5 seconds
        run: sleep 5

      - name: Step 2d — Links + images + social
        run: |
          echo "=== Step 2d: Generating links + images + social ==="
          HTTP_CODE=$(curl --silent --show-error --max-time 55 -o /tmp/step2d.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/blog/step2d-links")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/step2d.json
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Step 2d failed"
            exit 1
          fi
          echo "✓ Step 2d done"

      - name: Wait 5 seconds
        run: sleep 5

      - name: Step 3 — Publish
        run: |
          echo "=== Step 3: Publishing ==="
          HTTP_CODE=$(curl --silent --show-error --max-time 55 -o /tmp/step3.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/blog/step3-publish")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/step3.json
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Step 3 failed"
            exit 1
          fi
          echo "✓ Step 3 done — article published!"
