name: Auto-generate blog post (multi-step pipeline)

on:
  schedule:
    - cron: "0 6,14,22 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # ============================================================
      # STEP RETRY POLICY (2026-08-27 — Vercel Hobby timeout cure)
      #
      # Each Vercel serverless request is hard-capped at 60s, and the
      # in-app AI fallback chain is budget-clamped to ≤52s. The GHA job
      # provides the OUTER retry loop between separate HTTP calls:
      # every pipeline step gets up to 3 attempts with a 120s backoff
      # (M16 lets the routes re-process "failed" queue rows).
      # ============================================================

      # ============================================================
      # Step 1 — Pick topic (controlled retry, max 3 attempts)
      #   - Attempt 1: immediate
      #   - On failure: wait 2 minutes, then Attempt 2
      #   - On failure: wait 4 minutes, then Attempt 3
      #   - On final failure: exit 1 → job stops, Step 2a+ are SKIPPED
      #   - On any success: capture queueId from JSON response,
      #     write to GITHUB_ENV so subsequent steps can use it.
      # ============================================================
      - name: Step 1 — Pick topic (controlled retry, max 3 attempts)
        run: |
          echo "=== Step 1: Picking topic (controlled retry: max 3 attempts, 2m + 4m backoff) ==="
          MAX_ATTEMPTS=3
          attempt=1
          QUEUE_ID=""
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "--- Step 1 attempt $attempt / $MAX_ATTEMPTS ---"
            HTTP_CODE=$(curl --silent --show-error --max-time 55 -o /tmp/step1.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ vars.SITE_URL }}/api/cron/blog/step1-pick")
            echo "HTTP status: $HTTP_CODE"
            cat /tmp/step1.json
            echo ""
            if [ "$HTTP_CODE" -lt 400 ]; then
              echo "✓ Step 1 SUCCEEDED on attempt $attempt — stopping retry, queue item inserted"
              QUEUE_ID=$(python3 -c "import json; d=json.load(open('/tmp/step1.json')); print(d.get('queueId',''))" 2>/dev/null || echo "")
              if [ -z "$QUEUE_ID" ]; then
                echo "❌ Step 1 returned HTTP $HTTP_CODE but no queueId in response — aborting"
                exit 1
              fi
              echo "QUEUE_ID=$QUEUE_ID" >> "$GITHUB_ENV"
              echo "✓ Captured queueId: $QUEUE_ID"
              break
            fi
            echo "❌ Step 1 FAILED on attempt $attempt (HTTP $HTTP_CODE)"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              if [ "$attempt" -eq 1 ]; then
                WAIT_SECONDS=120
                WAIT_LABEL="2 minutes"
              else
                WAIT_SECONDS=240
                WAIT_LABEL="4 minutes"
              fi
              echo "↻ Waiting ${WAIT_LABEL} before retrying (backoff) — avoiding provider spam"
              sleep "$WAIT_SECONDS"
            fi
            attempt=$((attempt + 1))
          done
          if [ "$attempt" -gt "$MAX_ATTEMPTS" ]; then
            echo "❌ Step 1 FAILED after $MAX_ATTEMPTS attempts — Step 2a will NOT run (no queue item to consume)"
            exit 1
          fi

      # ============================================================
      # Handoff — stabilization buffer between Step 1 success and Step 2a.
      # Runs at the GitHub Actions orchestration level (NOT inside any
      # Vercel function — Vercel Hobby's 60s cap is never touched).
      # ============================================================
      - name: Wait 5 minutes — Step 1 → Step 2a stabilization handoff
        run: |
          echo "=== Handoff: waiting 5 minutes before Step 2a (orchestration-level sleep, NOT inside Vercel) ==="
          sleep 300
          echo "✓ 5-minute handoff buffer elapsed — proceeding to Step 2a"

      - name: Step 2a — Research (retry ×3, 120s backoff)
        run: |
          run_step() {
            curl --silent --show-error --max-time 55 -o /tmp/step2a.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ vars.SITE_URL }}/api/cron/blog/step2a-research?queueId=$QUEUE_ID"
          }
          MAX_ATTEMPTS=3; attempt=1; HTTP_CODE=""
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "--- Step 2a attempt $attempt / $MAX_ATTEMPTS ---"
            HTTP_CODE=$(run_step); echo "HTTP status: $HTTP_CODE"; cat /tmp/step2a.json; echo ""
            if [ "$HTTP_CODE" -lt 400 ]; then echo "✓ Step 2a done"; break; fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then echo "↻ Retrying in 120s"; sleep 120; fi
            attempt=$((attempt + 1))
          done
          if [ "$HTTP_CODE" -ge 400 ]; then echo "❌ Step 2a failed after $MAX_ATTEMPTS attempts"; exit 1; fi

      - name: Step 2b — English article + SEO (retry ×3, 120s backoff)
        run: |
          run_step() {
            curl --silent --show-error --max-time 55 -o /tmp/step2b.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ vars.SITE_URL }}/api/cron/blog/step2b-en-article?queueId=$QUEUE_ID"
          }
          MAX_ATTEMPTS=3; attempt=1; HTTP_CODE=""
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "--- Step 2b attempt $attempt / $MAX_ATTEMPTS ---"
            HTTP_CODE=$(run_step); echo "HTTP status: $HTTP_CODE"; cat /tmp/step2b.json; echo ""
            if [ "$HTTP_CODE" -lt 400 ]; then echo "✓ Step 2b done"; break; fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then echo "↻ Retrying in 120s"; sleep 120; fi
            attempt=$((attempt + 1))
          done
          if [ "$HTTP_CODE" -ge 400 ]; then echo "❌ Step 2b failed after $MAX_ATTEMPTS attempts"; exit 1; fi

      - name: Step 2c — Arabic article + FAQ (retry ×3, 120s backoff)
        run: |
          run_step() {
            curl --silent --show-error --max-time 55 -o /tmp/step2c.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ vars.SITE_URL }}/api/cron/blog/step2c-ar-article?queueId=$QUEUE_ID"
          }
          MAX_ATTEMPTS=3; attempt=1; HTTP_CODE=""
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "--- Step 2c attempt $attempt / $MAX_ATTEMPTS ---"
            HTTP_CODE=$(run_step); echo "HTTP status: $HTTP_CODE"; cat /tmp/step2c.json; echo ""
            if [ "$HTTP_CODE" -lt 400 ]; then echo "✓ Step 2c done"; break; fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then echo "↻ Retrying in 120s"; sleep 120; fi
            attempt=$((attempt + 1))
          done
          if [ "$HTTP_CODE" -ge 400 ]; then echo "❌ Step 2c failed after $MAX_ATTEMPTS attempts"; exit 1; fi

      - name: Step 2d — Links + images + social (retry ×3, 120s backoff)
        run: |
          run_step() {
            curl --silent --show-error --max-time 55 -o /tmp/step2d.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ vars.SITE_URL }}/api/cron/blog/step2d-links?queueId=$QUEUE_ID"
          }
          MAX_ATTEMPTS=3; attempt=1; HTTP_CODE=""
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "--- Step 2d attempt $attempt / $MAX_ATTEMPTS ---"
            HTTP_CODE=$(run_step); echo "HTTP status: $HTTP_CODE"; cat /tmp/step2d.json; echo ""
            if [ "$HTTP_CODE" -lt 400 ]; then echo "✓ Step 2d done"; break; fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then echo "↻ Retrying in 120s"; sleep 120; fi
            attempt=$((attempt + 1))
          done
          if [ "$HTTP_CODE" -ge 400 ]; then echo "❌ Step 2d failed after $MAX_ATTEMPTS attempts"; exit 1; fi

      - name: Step 3 — Publish (retry ×3, 120s backoff)
        run: |
          run_step() {
            curl --silent --show-error --max-time 55 -o /tmp/step3.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ vars.SITE_URL }}/api/cron/blog/step3-publish?queueId=$QUEUE_ID"
          }
          MAX_ATTEMPTS=3; attempt=1; HTTP_CODE=""
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "--- Step 3 attempt $attempt / $MAX_ATTEMPTS ---"
            HTTP_CODE=$(run_step); echo "HTTP status: $HTTP_CODE"; cat /tmp/step3.json; echo ""
            if [ "$HTTP_CODE" -lt 400 ]; then echo "✓ Step 3 done — article published!"; break; fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then echo "↻ Retrying in 120s"; sleep 120; fi
            attempt=$((attempt + 1))
          done
          if [ "$HTTP_CODE" -ge 400 ]; then echo "❌ Step 3 failed after $MAX_ATTEMPTS attempts"; exit 1; fi
