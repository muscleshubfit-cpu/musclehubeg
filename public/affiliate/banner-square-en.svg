<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" preserveAspectRatio="xMidYMid meet" role="img" aria-label="MuscleHubEG — Your AI fitness &amp; nutrition coach. Personalized plans, 24/7 coaching. Start free.">
  <defs>
    <linearGradient id="bs-en-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="bs-en-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
    <linearGradient id="bs-en-cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
    <filter id="bs-en-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="250" height="250" fill="url(#bs-en-bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="250" height="4" fill="url(#bs-en-accent)"/>

  <!-- Logo mark + brand -->
  <g transform="translate(15, 20)">
    <g filter="url(#bs-en-shadow)">
      <rect x="0" y="0" width="32" height="32" rx="8" fill="#ffffff"/>
      <rect x="7" y="11" width="18" height="10" rx="2" fill="#0a0a0a"/>
      <rect x="3" y="14" width="3" height="5" rx="1" fill="#0a0a0a"/>
      <rect x="26" y="14" width="3" height="5" rx="1" fill="#0a0a0a"/>
    </g>
    <text x="42" y="16" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="-0.3">MuscleHub<tspan fill="#5ac8fa">EG</tspan></text>
    <text x="42" y="29" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500" fill="#8e8e93" letter-spacing="0.3">AI FITNESS PLATFORM</text>
  </g>

  <!-- Headline -->
  <text x="15" y="85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Your AI Fitness</text>
  <text x="15" y="106" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="-0.3">&amp; Nutrition Coach</text>

  <!-- Description -->
  <text x="15" y="130" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#a8a8ad">Personalized plans built</text>
  <text x="15" y="144" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#a8a8ad">around your goal — with</text>
  <text x="15" y="158" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#a8a8ad">24/7 AI coaching.</text>

  <!-- Benefit badge -->
  <g transform="translate(15, 174)">
    <rect x="0" y="0" width="220" height="22" rx="11" fill="#5ac8fa" fill-opacity="0.12" stroke="#5ac8fa" stroke-opacity="0.4" stroke-width="1"/>
    <text x="110" y="15" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#5ac8fa">✓ FREE TO START · NO CARD NEEDED</text>
  </g>

  <!-- CTA pill -->
  <g transform="translate(15, 208)" filter="url(#bs-en-shadow)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="url(#bs-en-cta)"/>
    <text x="110" y="20" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">START FREE →</text>
  </g>
</svg>
