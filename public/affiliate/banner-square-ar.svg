<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Alkemos — كوتش اللياقة والتغذية الذكي. خطط مخصصة + كوتش 24/7. ابدأ مجانًا.">
  <defs>
    <linearGradient id="bs-ar-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="bs-ar-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
    <linearGradient id="bs-ar-cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
    <filter id="bs-ar-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="250" height="250" fill="url(#bs-ar-bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="250" height="4" fill="url(#bs-ar-accent)"/>

  <!-- Logo mark + brand (right-aligned for RTL) -->
  <g transform="translate(203, 20)">
    <g filter="url(#bs-ar-shadow)">
      <rect x="0" y="0" width="32" height="32" rx="8" fill="#ffffff"/>
      <rect x="7" y="11" width="18" height="10" rx="2" fill="#0a0a0a"/>
      <rect x="3" y="14" width="3" height="5" rx="1" fill="#0a0a0a"/>
      <rect x="26" y="14" width="3" height="5" rx="1" fill="#0a0a0a"/>
    </g>
    <text x="-8" y="16" text-anchor="end" font-family="Cairo, Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Alkemos<tspan fill="#5ac8fa">EG</tspan></text>
    <text x="-8" y="29" text-anchor="end" font-family="Cairo, Inter, system-ui, sans-serif" font-size="8" font-weight="500" fill="#8e8e93" letter-spacing="0.3">منصة اللياقة الذكية</text>
  </g>

  <!-- Headline (right-aligned) -->
  <text x="235" y="85" text-anchor="end" font-family="Cairo, Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="-0.3">كوتش اللياقة</text>
  <text x="235" y="106" text-anchor="end" font-family="Cairo, Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="-0.3">والتغذية الذكي</text>

  <!-- Description -->
  <text x="235" y="130" text-anchor="end" font-family="Cairo, Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#a8a8ad">خطط مخصصة لهدفك —</text>
  <text x="235" y="144" text-anchor="end" font-family="Cairo, Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#a8a8ad">مع كوتش ذكاء اصطناعي</text>
  <text x="235" y="158" text-anchor="end" font-family="Cairo, Inter, system-ui, sans-serif" font-size="10" font-weight="400" fill="#a8a8ad">24/7 لتدريبك وتغذيتك.</text>

  <!-- Benefit badge -->
  <g transform="translate(15, 174)">
    <rect x="0" y="0" width="220" height="22" rx="11" fill="#5ac8fa" fill-opacity="0.12" stroke="#5ac8fa" stroke-opacity="0.4" stroke-width="1"/>
    <text x="110" y="15" text-anchor="middle" font-family="Cairo, Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#5ac8fa">✓ ابدأ مجانًا · بدون بطاقة</text>
  </g>

  <!-- CTA pill -->
  <g transform="translate(15, 208)" filter="url(#bs-ar-shadow)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="url(#bs-ar-cta)"/>
    <text x="110" y="20" text-anchor="middle" font-family="Cairo, Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">← ابدأ مجانًا</text>
  </g>
</svg>
