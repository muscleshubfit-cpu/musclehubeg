<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" role="img" aria-label="MuscleHubEG — AI fitness and nutrition platform. Join now.">
  <defs>
    <linearGradient id="bg250" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent250" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
    <filter id="shadow250" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect fill="url(#bg250)"/>
  <rect x="0" y="0" fill="url(#accent250)"/>

  <!-- Logo -->
  <g transform="translate(100, 35)" filter="url(#shadow250)">
    <rect x="0" y="14" rx="7" fill="#ffffff"/>
    <rect x="8" y="4" rx="5" fill="none" stroke="#ffffff" stroke-width="3"/>
    <rect x="-5" y="9" rx="2" fill="#ffffff"/>
    <rect x="48" y="9" rx="2" fill="#ffffff"/>
  </g>

  <text x="125" y="115" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="-0.3">MuscleHub<tspan fill="#5ac8fa">EG</tspan></text>

  <!-- Headline -->
  <text x="125" y="145" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Train smarter.</text>
  <text x="125" y="163" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Eat better.</text>
  <text x="125" y="181" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Transform faster.</text>

  <g transform="translate(50, 200)">
    <rect x="0" y="0" rx="18" fill="url(#accent250)" filter="url(#shadow250)"/>
    <text x="75" y="24" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">JOIN NOW →</text>
  </g>
</svg>
