<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Musclehubeg — Your AI fitness &amp; nutrition coach. Personalized plans, 24/7 coaching. Start free.">
  <defs>
    <linearGradient id="bm-en-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="bm-en-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
    <linearGradient id="bm-en-cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
    <filter id="bm-en-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="300" height="250" fill="url(#bm-en-bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="300" height="4" fill="url(#bm-en-accent)"/>

  <!-- Logo mark + brand -->
  <g transform="translate(20, 22)">
    <g filter="url(#bm-en-shadow)">
      <rect x="0" y="0" width="36" height="36" rx="9" fill="#ffffff"/>
      <rect x="8" y="12" width="20" height="12" rx="2" fill="#0a0a0a"/>
      <rect x="4" y="15" width="3" height="6" rx="1" fill="#0a0a0a"/>
      <rect x="29" y="15" width="3" height="6" rx="1" fill="#0a0a0a"/>
    </g>
    <text x="46" y="18" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Musclehubeg<tspan fill="#5ac8fa">EG</tspan></text>
    <text x="46" y="32" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#8e8e93" letter-spacing="0.4">AI FITNESS PLATFORM</text>
  </g>

  <!-- Headline -->
  <text x="20" y="90" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Your AI Fitness</text>
  <text x="20" y="112" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="-0.3">&amp; Nutrition Coach</text>

  <!-- Description -->
  <text x="20" y="138" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#a8a8ad">Personalized plans built around</text>
  <text x="20" y="152" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#a8a8ad">your goal — with 24/7 AI coaching.</text>

  <!-- Benefit badges -->
  <g transform="translate(20, 168)">
    <rect x="0" y="0" width="118" height="22" rx="11" fill="#5ac8fa" fill-opacity="0.12" stroke="#5ac8fa" stroke-opacity="0.4" stroke-width="1"/>
    <text x="59" y="15" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#5ac8fa">✓ NO CREDIT CARD</text>
  </g>
  <g transform="translate(144, 168)">
    <rect x="0" y="0" width="118" height="22" rx="11" fill="#5ac8fa" fill-opacity="0.12" stroke="#5ac8fa" stroke-opacity="0.4" stroke-width="1"/>
    <text x="59" y="15" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#5ac8fa">✓ FREE TO START</text>
  </g>

  <!-- CTA pill -->
  <g transform="translate(20, 204)" filter="url(#bm-en-shadow)">
    <rect x="0" y="0" width="260" height="32" rx="16" fill="url(#bm-en-cta)"/>
    <text x="130" y="21" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">START FREE NOW →</text>
  </g>
</svg>
