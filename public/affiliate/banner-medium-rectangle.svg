<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" role="img" aria-label="MuscleHubEG — AI-powered fitness and nutrition. Start your journey.">
  <defs>
    <linearGradient id="bg300" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent300" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
    <filter id="shadow300" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect fill="url(#bg300)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" fill="url(#accent300)"/>

  <!-- Logo mark -->
  <g transform="translate(125, 30)" filter="url(#shadow300)">
    <rect x="0" y="14" rx="7" fill="#ffffff"/>
    <rect x="8" y="4" rx="5" fill="none" stroke="#ffffff" stroke-width="3"/>
    <rect x="-5" y="9" rx="2" fill="#ffffff"/>
    <rect x="48" y="9" rx="2" fill="#ffffff"/>
  </g>

  <!-- Brand -->
  <text x="150" y="100" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.3">MuscleHub<tspan fill="#5ac8fa">EG</tspan></text>

  <!-- Headline -->
  <text x="150" y="135" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Train smarter.</text>
  <text x="150" y="155" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Eat better.</text>
  <text x="150" y="175" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Transform faster.</text>

  <!-- CTA -->
  <g transform="translate(60, 195)">
    <rect x="0" y="0" rx="20" fill="url(#accent300)" filter="url(#shadow300)"/>
    <text x="90" y="26" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">START NOW →</text>
  </g>
</svg>
