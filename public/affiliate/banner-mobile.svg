<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 50" role="img" aria-label="MuscleHubEG — Join now. Train smarter, eat better, transform faster.">
  <defs>
    <linearGradient id="bg320" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent320" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect fill="url(#bg320)"/>
  <rect x="0" y="0" fill="url(#accent320)"/>

  <!-- Small logo mark -->
  <g transform="translate(14, 12)">
    <rect x="0" y="9" rx="3.5" fill="#ffffff"/>
    <rect x="3" y="3" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="-2" y="5" rx="1" fill="#ffffff"/>
    <rect x="20" y="5" rx="1" fill="#ffffff"/>
  </g>

  <!-- Brand -->
  <text x="48" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="-0.2">MuscleHub<tspan fill="#5ac8fa">EG</tspan></text>
  <text x="48" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#8e8e93">Train smarter. Transform faster.</text>

  <!-- CTA -->
  <g transform="translate(228, 11)">
    <rect x="0" y="0" rx="14" fill="url(#accent320)"/>
    <text x="40" y="19" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">JOIN →</text>
  </g>
</svg>
