<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 50" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Musclehubeg — كوتش لياقة ذكي. ابدأ مجانًا.">
  <defs>
    <linearGradient id="bm-ar-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="bm-ar-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
    <linearGradient id="bm-ar-cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="320" height="50" fill="url(#bm-ar-bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="320" height="2" fill="url(#bm-ar-accent)"/>

  <!-- Logo mark (right side for RTL) -->
  <g transform="translate(282, 11)">
    <rect x="0" y="0" width="28" height="28" rx="7" fill="#ffffff"/>
    <rect x="6" y="10" width="16" height="8" rx="2" fill="#0a0a0a"/>
    <rect x="3" y="12" width="3" height="4" rx="1" fill="#0a0a0a"/>
    <rect x="22" y="12" width="3" height="4" rx="1" fill="#0a0a0a"/>
  </g>

  <!-- Brand + tagline + headline (right-aligned for RTL) -->
  <text x="274" y="20" text-anchor="end" font-family="Cairo, Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="-0.2">Musclehubeg<tspan fill="#5ac8fa">EG</tspan></text>
  <text x="274" y="32" text-anchor="end" font-family="Cairo, Inter, system-ui, sans-serif" font-size="8" font-weight="500" fill="#8e8e93">كوتش اللياقة والتغذية</text>
  <text x="274" y="42" text-anchor="end" font-family="Cairo, Inter, system-ui, sans-serif" font-size="8" font-weight="600" fill="#a8a8ad">ابدأ مجانًا · بدون بطاقة</text>

  <!-- CTA pill (left side for RTL) -->
  <g transform="translate(10, 13)">
    <rect x="0" y="0" width="78" height="24" rx="12" fill="url(#bm-ar-cta)"/>
    <text x="39" y="16" text-anchor="middle" font-family="Cairo, Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">← ابدأ</text>
  </g>
</svg>
