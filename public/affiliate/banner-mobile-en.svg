<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 50" preserveAspectRatio="xMidYMid meet" role="img" aria-label="MuscleHubEG — AI fitness coach. Start free.">
  <defs>
    <linearGradient id="bm-en-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="bm-en-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
    <linearGradient id="bm-en-cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5ac8fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="320" height="50" fill="url(#bm-en-bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="320" height="2" fill="url(#bm-en-accent)"/>

  <!-- Logo mark -->
  <g transform="translate(10, 11)">
    <rect x="0" y="0" width="28" height="28" rx="7" fill="#ffffff"/>
    <rect x="6" y="10" width="16" height="8" rx="2" fill="#0a0a0a"/>
    <rect x="3" y="12" width="3" height="4" rx="1" fill="#0a0a0a"/>
    <rect x="22" y="12" width="3" height="4" rx="1" fill="#0a0a0a"/>
  </g>

  <!-- Brand + tagline + headline -->
  <text x="46" y="20" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="-0.2">MuscleHub<tspan fill="#5ac8fa">EG</tspan></text>
  <text x="46" y="32" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500" fill="#8e8e93">AI fitness &amp; nutrition coach</text>
  <text x="46" y="42" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#a8a8ad">Free to start · No card</text>

  <!-- CTA pill -->
  <g transform="translate(232, 13)">
    <rect x="0" y="0" width="78" height="24" rx="12" fill="url(#bm-en-cta)"/>
    <text x="39" y="16" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff">START →</text>
  </g>
</svg>
